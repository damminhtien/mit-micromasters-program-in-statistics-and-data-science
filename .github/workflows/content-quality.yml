name: Content quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown links and assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check local Markdown targets
        run: python scripts/check_content.py
